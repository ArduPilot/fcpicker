name: CI

# Runs on every push and pull request. Three jobs, split by what they need:
# the data suite needs only Python, the web suite only Node, and e2e needs a
# real build plus browsers — so a failure tells you immediately which half of
# the project broke, and the cheap jobs are not held up by the slow one.

on:
  push:
    branches: ["**"]
  pull_request:

# A new push supersedes the run in flight for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  data:
    name: Data pipeline (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python deps
        run: pip install -r tools/requirements.txt

      # The build-and-deploy tests shell out to `npm run build`, so the
      # frontend's dependencies have to exist for the slow subset to run.
      - name: Install frontend deps
        run: npm --prefix frontend ci --no-audit --no-fund

      - name: Sanity-check sensor counts
        run: python tools/sanity_check.py

      - name: pytest
        run: python -m pytest -q

  web:
    name: Frontend (lint, types, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm --prefix frontend ci --no-audit --no-fund

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Typecheck
        run: npx --prefix frontend tsc -b frontend/tsconfig.app.json --noEmit

      - name: Unit and component tests
        run: npm --prefix frontend run test

  e2e:
    name: End-to-end (chromium + firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm --prefix frontend ci --no-audit --no-fund

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx --prefix frontend playwright install chromium firefox --with-deps

      - name: Install browser system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx --prefix frontend playwright install-deps chromium firefox

      # e2e runs against the real built output served as plain files, which is
      # what nginx will do — so the build must happen first.
      - name: Build
        run: npm run build

      - name: Playwright
        run: npm --prefix frontend run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
